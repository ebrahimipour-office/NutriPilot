{% extends "base.html" %}

{% block title %}ثبت مراجع جدید | NutriPilot{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <a href="/clients" class="text-muted" style="text-decoration: none; font-size: 0.9rem;">&rarr; بازگشت به لیست مراجعان</a>
    <h1 class="page-title" style="margin-top: 0.5rem;">ثبت مراجع جدید</h1>
  </div>
</div>

<div class="card" style="max-width: 600px;">
  <div class="card-header">
    <h2 class="card-title">اطلاعات اولیه مراجع</h2>
  </div>
  <div class="card-body">
    <form action="/clients" method="POST">
      <div class="form-group">
        <label for="name" class="form-label">نام و نام خانوادگی مراجع</label>
        <input
          type="text"
          id="name"
          name="name"
          class="form-control"
          placeholder="مثلاً: علی رضایی"
          required
          autofocus
        >
        <span class="form-hint">نام مراجع برای تفکیک پرونده، چت‌ها و برنامه‌های غذایی استفاده می‌شود.</span>
      </div>

      <div class="form-actions" style="margin-bottom: 0;">
        <button type="submit" class="btn btn-primary">ثبت مراجع</button>
        <a href="/clients" class="btn btn-secondary" style="margin-inline-start: 0.5rem;">انصراف</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
